<!DOCTYPE html>
<html>
<head>
    <title>Object Example</title>
</head>
<body>

<script>
    var person = {
        name: "Aditi",
        age: 20,
        city: "Pune"
    };

    document.write(person.name + " " + person.age);
    document.write("<br><br>");

    person.age = 22;

    person.job = "Developer";

    document.write(
        "{ name: '" + person.name + 
        "', age: " + person.age + 
        ", city: '" + person.city + 
        "', job: '" + person.job + "' }"
    );
</script>

</body>
</html>
